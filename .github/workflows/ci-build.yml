name: CI Build Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  install-scripts:
    name: Test Installer Scripts (systemd and Alpine OpenRC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run installer regression tests
        run: bash test-install-scripts-proxy.sh

      - name: Test Alpine bootstrap and OpenRC lifecycle
        run: docker run --rm -v "$PWD:/workspace:ro" alpine:3.22 sh /workspace/test-install-scripts-alpine.sh

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vite-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      # myflvx keeps the npm-based alpha4 frontend (upstream later moved to pnpm)
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build
        run: npm run build

  backend:
    name: Build Go Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-backend/go.mod'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

  myflvx-tests:
    name: myflvx Feature Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-backend/go.mod'
          cache-dependency-path: go-backend/go.sum

      - name: Vet
        run: go vet ./internal/proxykit/... ./internal/http/... ./internal/store/...

      - name: Subscription, relay, deploy and backup tests
        run: |
          go test -count=1 ./internal/proxykit/...
          go test -count=1 ./internal/store/repo/ -run 'Backup|Import'
          go test -count=1 ./tests/contract/ -run 'TestMyflvx'

  backend-postgres-contract:
    name: Go Backend PostgreSQL Contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flux_test
          POSTGRES_PASSWORD: flux_test_pass
          POSTGRES_DB: flux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flux_test -d flux_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: go-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-backend/go.mod'
          cache-dependency-path: go-backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run PostgreSQL contract test
        env:
          FLVX_POSTGRES_TEST_DSN: 'postgres://flux_test:flux_test_pass@127.0.0.1:5432/flux_test?sslmode=disable'
        run: go test ./tests/contract -run TestPostgresNodeCreateRepairsMissingIDDefaultContract -count=1

  agent:
    name: Build Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-gost
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go-gost/go.mod'
          cache-dependency-path: go-gost/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v .
